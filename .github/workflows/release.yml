name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux-appimage:
    name: Build Linux AppImage (${{ github.ref_name }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Just
        uses: extractions/setup-just@v2

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 desktop-file-utils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"

      - name: Build and Package Linux AppImage
        run: |
          just package-linux

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: metaglyph-linux-appimage
          path: dist/linux/*.AppImage

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/linux/*.AppImage
          generate_release_notes: true
          body: |
            ### Metaglyph Desktop Application Release (${{ github.ref_name }})

            #### Linux Installation & Execution

            1. Download the `Metaglyph-*.AppImage` asset below.
            2. Grant executable permissions:
               ```bash
               chmod +x Metaglyph-*.AppImage
               ./Metaglyph-*.AppImage
               ```

            #### Recommended AppImage Manager: Gear Lever

            For seamless desktop integration, automatic menu entry creation, application updates, and sandbox management, we strongly recommend managing your AppImage using **[Gear Lever](https://flathub.org/apps/it.mijorus.gearlever)**:
            - Flathub: `flatpak install flathub it.mijorus.gearlever`
            - GitHub: [mijorus/gearlever](https://github.com/mijorus/gearlever)
